name: Publish Simple WP History 1.0.1

on:
  push:
    paths:
      - 'release-v1.0.1.trigger'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish Simple WP History 1.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/simple-wp-history
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='build' \
            --exclude='release-v1.0.trigger' \
            --exclude='release-v1.0.1.trigger' \
            --exclude='*.zip' \
            ./ build/simple-wp-history/
          cd build
          zip -r ../simple-wp-history-1.0.1.zip simple-wp-history

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.1 simple-wp-history-1.0.1.zip \
            --target main \
            --title "Simple WP History 1.0.1" \
            --notes "Maintenance release to verify the GitHub-to-WordPress update flow.

          Changes:
          - Refined admin interface wording
          - No database schema changes
          - No settings reset

          This release is intended as a safe updater test for sites currently running version 1.0."
